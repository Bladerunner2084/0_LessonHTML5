# The application ships with zero runtime dependencies, so there is nothing to
# build: the deploy step uploads the repository as-is. Playwright is installed
# only to drive the browser tests, and never reaches the published site.
name: Test and deploy

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Graph and continuity tests
        run: node tests/smoke.mjs

      - name: Reader model tests
        run: node tests/reader.mjs

      - name: Screenplay converter tests
        run: node tests/script.mjs

      - name: Style engine tests
        run: node tests/voice.mjs

      - name: Import and search tests
        run: node tests/io.mjs

      - name: Landing page tests
        run: node tests/landing.mjs

      - name: Build the single-file distributable
        run: node build.mjs

      - name: Distribution tests (file://, offline)
        run: node tests/dist.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: writeline-single-file
          path: dist/writeline.html

      - name: Install Chromium for the browser tests
        run: |
          npm install --no-save playwright@^1.56.0
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: node tests/browser.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the landing page is published. The application itself is the thing
      # being sold, so it is deliberately NOT deployed to a public URL.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
